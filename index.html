<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#b7e39a">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#3aa76d">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<title>作り置き買い物リスト</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🥗 作り置き買い物リスト</h1>
  <p class="note">週1回のまとめ買い用（1メニュー＝約5食分）。MIND食ベース。</p>
  <div class="allergy">アレルギー除外中：卵・そば・うなぎ（マヨネーズ等の卵加工品も除外）</div>
</header>
<main>
  <section id="view-pick">
    <h2>メニューを選ぶ</h2>
    <div class="grid" id="menus"></div>

    <h2>いつもの定番</h2>
    <div class="grid" id="staples"></div>

    <div class="bar"><button class="danger" id="reset">全部リセット</button></div>
    <div class="fixbar"><button type="button" id="confirm">確定して買い物リストを見る</button></div>
  </section>

  <section id="view-list" hidden>
    <div class="bar"><button type="button" id="back">選び直す</button></div>
    <h2>買い物リスト <span class="prog" id="prog"></span></h2>
    <div id="total"></div>
    <div id="list"></div>
    <div class="fixbar"><button type="button" id="toRecipe">作り方を見る</button></div>
  </section>

  <section id="view-recipe" hidden>
    <div class="bar"><button type="button" id="backList">買い物リストに戻る</button></div>
    <h2>作り方</h2>
    <div id="recipes"></div>
    <div class="fixbar"><button type="button" id="backListB">買い物リストに戻る</button></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
