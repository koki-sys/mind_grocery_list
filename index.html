<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2f7d4f">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<title>作り置き買い物リスト</title>
<style>
:root{
  --bg:#f6f7f4;--card:#fff;--text:#1f2a24;--sub:#5f6b64;--line:#dfe4dc;
  --accent:#2f7d4f;--accent-text:#fff;--sel:#e4f3ea;--warn:#8a5a00;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121613;--card:#1c221e;--text:#e8eee9;--sub:#9aa79f;--line:#2e372f;
  --accent:#4fb87c;--accent-text:#08140d;--sel:#1f3a2a;--warn:#e0b050}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(96px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
[hidden]{display:none!important}
.fixbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.fixbar button{display:block;width:100%;max-width:640px;margin:0 auto;min-height:56px;font-size:1.1rem;font-weight:700;
  background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
header,main{max-width:640px;margin:0 auto;padding:0 14px}
h1{font-size:1.3rem;margin:18px 0 4px}
.note{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.allergy{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);
  border-radius:8px;padding:8px 12px;font-size:.85rem;color:var(--warn);margin:8px 0}
h2{font-size:1.1rem;margin:24px 0 8px}
h3{font-size:.95rem;margin:16px 0 6px;color:var(--sub)}
.grid{display:grid;gap:8px}
label.card{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;
  background:var(--card);border:2px solid var(--line);border-radius:12px;cursor:pointer}
label.card.on{background:var(--sel);border-color:var(--accent)}
input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:var(--accent);margin:0}
.t{flex:1}.t small{display:block;color:var(--sub);font-size:.8rem}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li label{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--line)}
li:first-child label{border-top:0}
li .amt{color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
li .nm{flex:1}
li.done .nm,li.done .amt{text-decoration:line-through;opacity:.5}
.src{display:block;font-size:.72rem;color:var(--sub)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:1rem;cursor:pointer}
button.danger{border-color:#c0504d;color:#c0504d}
.empty{color:var(--sub);padding:16px;text-align:center}
.prog{color:var(--sub);font-size:.85rem}
.total{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;margin:8px 0}
.total .big{font-size:1.5rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.total small{display:block;color:var(--sub);font-size:.75rem}
.sub{color:var(--text);font-weight:600;text-align:right;margin:8px 2px;font-variant-numeric:tabular-nums}
li .pr{color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right}
li.done .pr{text-decoration:line-through;opacity:.5}
.rc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px 14px;margin:12px 0}
.rc h3{font-size:1.05rem;color:var(--text);margin:12px 0 6px}
.rc h4{font-size:.85rem;color:var(--sub);margin:12px 0 4px}
.rc ul{border:0;border-radius:0;background:none;overflow:visible}
.rc ul li{padding:4px 0;border-top:1px solid var(--line)}
.rc ul li:first-child{border-top:0}
.rc ol{margin:0;padding-left:1.6em}
.rc ol li{padding:4px 0;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>🥗 作り置き買い物リスト</h1>
  <p class="note">週1回のまとめ買い用（1メニュー＝約5食分）。MIND食ベース。</p>
  <div class="allergy">アレルギー除外中：卵・そば・うなぎ（マヨネーズ等の卵加工品も除外）</div>
</header>
<main>
  <section id="view-pick">
    <h2>メニューを選ぶ</h2>
    <div class="grid" id="menus"></div>

    <h2>いつもの定番</h2>
    <div class="grid" id="staples"></div>

    <div class="bar"><button class="danger" id="reset">全部リセット</button></div>
    <div class="fixbar"><button type="button" id="confirm">確定して買い物リストを見る</button></div>
  </section>

  <section id="view-list" hidden>
    <div class="bar"><button type="button" id="back">選び直す</button></div>
    <h2>買い物リスト <span class="prog" id="prog"></span></h2>
    <div id="total"></div>
    <div id="list"></div>
    <div class="fixbar"><button type="button" id="toRecipe">作り方を見る</button></div>
  </section>

  <section id="view-recipe" hidden>
    <div class="bar"><button type="button" id="backList">買い物リストに戻る</button></div>
    <h2>作り方</h2>
    <div id="recipes"></div>
  </section>
</main>
<script>
(function(){
"use strict";

/* ---------- アレルギーガード（二重防御の2層目） ---------- */
var BLOCKED = ["卵","玉子","たまご","タマゴ","そば","ソバ","蕎麦","うなぎ","ウナギ","鰻","マヨネーズ","マヨ"];
function isAllowed(name){
  var n = String(name || "");
  for(var i=0;i<BLOCKED.length;i++){ if(n.indexOf(BLOCKED[i]) !== -1) return false; }
  return true;
}
function guardIngredients(list){ return list.filter(function(x){ return isAllowed(x.name); }); }

/* ---------- データ（1層目：卵・そば・うなぎ無し） ---------- */
var V="野菜・きのこ", M="肉・魚", B="豆・大豆製品", C="缶詰・乾物", G="穀物", O="その他";
/* 単価（円／その材料のunitあたり）。マルキョウ想定の目安 */
var PRICES = {
 "鶏むね肉":0.75,"鶏ひき肉":1.1,"サバ切り身":150,"鮭切り身":180,"玉ねぎ":60,"にんじん":60,
 "セロリ":120,"キャベツ":200,"ほうれん草":180,"小松菜":130,"ブロッコリー":180,"ごぼう":90,
 "しめじ":110,"えのき":90,"にんにく":60,"生姜":100,"ひよこ豆缶":130,"トマト缶":110,
 "ツナ缶":130,"レンズ豆":1.5,"厚揚げ":110,"大豆水煮":100,"干し椎茸":40,"オートミール":500,
 "玄米":1800,"冷凍ブルーベリー":450,"ミックスナッツ":700,"豆乳":0.18,"オリーブオイル":2.5,
 "塩":0.2,"味噌":0.8,"カレー粉":10,"コンソメ":30,"だし":0.5,"醤油":0.7,"みりん":0.8,
 "ごま油":2.5,"レモン汁":2.5,"白ごま":3
};
function I(name,amount,unit,category,isSeasoning){
  return {name:name,amount:amount,unit:unit,category:category,isSeasoning:!!isSeasoning,price:PRICES[name]};
}
var RECIPES = [
 {id:"r1",name:"サラダチキン",ingredients:[
  I("鶏むね肉",600,"g",M),I("オリーブオイル",15,"ml",O,true),I("塩",6,"g",O,true)]},
 {id:"r2",name:"サバの味噌煮",ingredients:[
  I("サバ切り身",4,"枚",M),I("味噌",50,"g",O,true),I("生姜",1,"個",V)]},
 {id:"r3",name:"鮭ときのこの蒸し物",ingredients:[
  I("鮭切り身",4,"枚",M),I("しめじ",2,"パック",V),I("えのき",1,"袋",V),I("玉ねぎ",1,"個",V)]},
 {id:"r4",name:"ひよこ豆とほうれん草のカレー炒め",ingredients:[
  I("ひよこ豆缶",2,"缶",C),I("ほうれん草",1,"束",V),I("玉ねぎ",1,"個",V),
  I("トマト缶",1,"缶",C),I("カレー粉",10,"g",O,true),I("オリーブオイル",15,"ml",O,true)]},
 {id:"r5",name:"レンズ豆と野菜のスープ",ingredients:[
  I("レンズ豆",150,"g",C),I("にんじん",1,"本",V),I("セロリ",1,"本",V),I("玉ねぎ",1,"個",V),
  I("トマト缶",1,"缶",C),I("コンソメ",2,"個",O,true)]},
 {id:"r6",name:"厚揚げと小松菜の煮びたし",ingredients:[
  I("厚揚げ",2,"枚",B),I("小松菜",1,"束",V),I("だし",300,"ml",O,true),I("醤油",30,"ml",O,true)]},
 {id:"r7",name:"ブロッコリーとツナのサラダ",ingredients:[
  I("ブロッコリー",2,"個",V),I("ツナ缶",2,"缶",C),I("レモン汁",30,"ml",O,true)]},
 {id:"r8",name:"鶏むねとキャベツのオリーブオイル蒸し",ingredients:[
  I("鶏むね肉",500,"g",M),I("キャベツ",0.5,"個",V),I("にんにく",2,"個",V),I("オリーブオイル",30,"ml",O,true)]},
 {id:"r9",name:"鶏そぼろと大豆の煮物",ingredients:[
  I("鶏ひき肉",400,"g",M),I("大豆水煮",2,"パック",B),I("にんじん",1,"本",V),I("干し椎茸",6,"個",C),
  I("醤油",45,"ml",O,true),I("みりん",45,"ml",O,true)]},
 {id:"r10",name:"ごぼうとにんじんのきんぴら",ingredients:[
  I("ごぼう",2,"本",V),I("にんじん",1,"本",V),I("ごま油",15,"ml",O,true),
  I("醤油",30,"ml",O,true),I("白ごま",10,"g",O,true)]}
];
/* 作り方（手順）。RECIPESの各要素に steps として付与 */
var STEPS = {
 "r1":["鶏むね肉は皮を取り、厚い部分を開いて厚さを均一にし、フォークで数か所刺す",
  "塩とオリーブオイルをすり込み、耐熱の保存袋に入れて空気を抜く",
  "湯を沸かした鍋の火を止め、袋ごと入れてフタをし、40〜50分置く",
  "火の通りを確認して取り出し、粗熱が取れてから切る。冷蔵で4〜5日保存可"],
 "r2":["生姜は皮をむいて薄切りにする。サバは皮目に十字の切り込みを入れる",
  "鍋に水200ml（分量外）と味噌を溶き、生姜を入れて火にかける",
  "煮立ったらサバを皮目を上にして並べ、落しぶたをして弱火で10分煮る",
  "煮汁をかけながらさらに5分煮て、照りが出たら火を止める。冷蔵で3〜4日保存可"],
 "r3":["しめじとえのきは石づきを落としてほぐす。玉ねぎは薄切りにする",
  "フライパンに玉ねぎ、きのこの順に広げ、上に鮭を並べる",
  "水大さじ3（分量外）をふり、フタをして中火で蒸し焼きにする",
  "鮭に火が通るまで8〜10分蒸したら火を止める。冷蔵で3日保存可"],
 "r4":["玉ねぎは薄切り、ほうれん草は4cm幅に切る。ひよこ豆缶は汁気を切る",
  "フライパンにオリーブオイルを熱し、玉ねぎをしんなりするまで炒める",
  "ひよこ豆とトマト缶を加え、5分ほど煮詰める",
  "カレー粉を加えて混ぜ、ほうれん草を加えてさっと火を通す。冷蔵で4日保存可"],
 "r5":["にんじん、セロリ、玉ねぎは1cm角に切る。レンズ豆はさっと洗う",
  "鍋に野菜、レンズ豆、トマト缶、水600ml（分量外）を入れて火にかける",
  "沸騰したらアクを取り、コンソメを加えて弱火で20分煮る",
  "レンズ豆がやわらかくなったら火を止める。冷蔵で4〜5日保存可（冷凍も可）"],
 "r6":["厚揚げは熱湯をかけて油抜きし、食べやすい大きさに切る。小松菜は4cm幅に切る",
  "鍋にだしと醤油を入れて火にかけ、厚揚げを加えて5分煮る",
  "小松菜を加え、しんなりするまで2〜3分煮る",
  "火を止めてそのまま冷まし、味を含ませる。冷蔵で3〜4日保存可"],
 "r7":["ブロッコリーは小房に分け、塩ゆで（塩は分量外）して水気をよく切る",
  "ツナ缶は油を軽く切る",
  "ボウルでブロッコリーとツナをレモン汁で和える",
  "冷蔵で3日保存可"],
 "r8":["鶏むね肉は皮を取り、そぎ切りにする。キャベツはざく切り、にんにくは薄切りにする",
  "フライパンにオリーブオイルとにんにくを入れて弱火で熱し、香りを出す",
  "キャベツを広げ、上に鶏むね肉を並べてフタをし、中火で8〜10分蒸し焼きにする",
  "鶏肉に火が通ったら全体を混ぜる。冷蔵で3〜4日保存可"],
 "r9":["干し椎茸は水で戻して薄切りにする（戻し汁は取っておく）。にんじんは粗みじん切りにする。大豆水煮は汁気を切る",
  "鍋に椎茸の戻し汁200ml（分量外の水で調整）、醤油、みりんを入れて火にかける",
  "鶏ひき肉を加えてほぐしながら煮て、にんじん、椎茸、大豆を加える",
  "落しぶたをして弱火で12〜15分煮て、煮汁が少なくなるまで煮詰める。冷蔵で4〜5日保存可（冷凍も可）"],
 "r10":["ごぼうはささがきにして水にさらし、水気を切る。にんじんは細切りにする",
  "フライパンにごま油を熱し、ごぼうとにんじんを中火で3〜4分炒める",
  "醤油を加え、汁気がなくなるまで炒め煮にする",
  "火を止めて白ごまをふる。冷蔵で4〜5日保存可"]
};
RECIPES.forEach(function(r){ r.steps = STEPS[r.id] || []; });
var STAPLES = [
 {id:"s1",name:"オートミール",ingredients:[I("オートミール",1,"袋",G)]},
 {id:"s2",name:"玄米",ingredients:[I("玄米",1,"袋",G)]},
 {id:"s3",name:"冷凍ブルーベリー",ingredients:[I("冷凍ブルーベリー",1,"袋",O)]},
 {id:"s4",name:"ミックスナッツ",ingredients:[I("ミックスナッツ",1,"袋",O)]},
 {id:"s5",name:"豆乳",ingredients:[I("豆乳",1000,"ml",O)]}
];
var CATS = [V,M,B,C,G,O];
var SEASON_LABEL = "調味料（家にあるかも）";

/* ---------- 状態 ---------- */
var KEY = "mealprep.v1";
var state = {menus:[],staples:[],checked:{}};
try{
  var s = JSON.parse(localStorage.getItem(KEY) || "null");
  if(s){
    state.menus = (s.menus||[]).filter(function(id){return RECIPES.some(function(r){return r.id===id;});});
    state.staples = (s.staples||[]).filter(function(id){return STAPLES.some(function(r){return r.id===id;});});
    state.checked = s.checked || {};
  }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* 画面（保存しない。常に「選ぶ」から開始） */
var view = "pick";
function setView(v){
  view = (v === "list" || v === "recipe") ? v : "pick";
  if(view === "recipe") renderRecipes();
  applyView();
  window.scrollTo(0,0);
}
function applyView(){
  document.getElementById("view-pick").hidden = (view !== "pick");
  document.getElementById("view-list").hidden = (view !== "list");
  document.getElementById("view-recipe").hidden = (view !== "recipe");
}

/* ---------- 合算 ---------- */
function build(){
  var map = {}, order = [];
  var sources = RECIPES.filter(function(r){return state.menus.indexOf(r.id)>-1;})
    .concat(STAPLES.filter(function(r){return state.staples.indexOf(r.id)>-1;}));
  sources.forEach(function(src){
    guardIngredients(src.ingredients).forEach(function(ing){   // 必ずガードを通す
      var k = ing.name+"|"+ing.unit;
      if(!map[k]){ map[k]={key:k,name:ing.name,unit:ing.unit,amount:0,category:ing.category,isSeasoning:ing.isSeasoning,price:ing.price,from:[]}; order.push(k); }
      map[k].amount += ing.amount;
      if(map[k].from.indexOf(src.name)<0) map[k].from.push(src.name);
    });
  });
  return guardIngredients(order.map(function(k){return map[k];}));  // 最終出力も再度ガード
}
function fmt(n){ return String(Math.round(n*100)/100); }
function rowPrice(it){ return Math.round(it.amount*(it.price||0)/10 + 1e-9)*10; }   // 10円単位に四捨五入
function yen(n){ return n.toLocaleString("ja-JP"); }

/* ---------- 描画 ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function renderPickers(){
  document.getElementById("menus").innerHTML = RECIPES.map(function(r){
    var on = state.menus.indexOf(r.id)>-1;
    return '<label class="card'+(on?' on':'')+'"><input type="checkbox" data-kind="menus" data-id="'+r.id+'"'+(on?' checked':'')+
      '><span class="t">'+esc(r.name)+'<small>約5食分</small></span></label>';
  }).join("");
  document.getElementById("staples").innerHTML = STAPLES.map(function(r){
    var on = state.staples.indexOf(r.id)>-1;
    return '<label class="card'+(on?' on':'')+'"><input type="checkbox" data-kind="staples" data-id="'+r.id+'"'+(on?' checked':'')+
      '><span class="t">'+esc(r.name)+'</span></label>';
  }).join("");
}
function itemHtml(it){
  var c = !!state.checked[it.key];
  return '<li class="'+(c?'done':'')+'"><label><input type="checkbox" data-key="'+esc(it.key)+'"'+(c?' checked':'')+
    '><span class="nm">'+esc(it.name)+'<span class="src">'+esc(it.from.join("・"))+'</span></span><span class="amt">'+
    fmt(it.amount)+esc(it.unit)+'</span><span class="pr">約'+yen(rowPrice(it))+'円</span></label></li>';
}
function renderList(){
  var items = build(), el = document.getElementById("list");
  var prog = document.getElementById("prog");
  var totalEl = document.getElementById("total");
  if(!items.length){ totalEl.innerHTML=""; el.innerHTML='<div class="empty">メニューか定番を選ぶとここに表示されます</div>'; prog.textContent=""; return; }
  var done = items.filter(function(i){return state.checked[i.key];}).length;
  prog.textContent = done+" / "+items.length;
  var sum = function(a){ return a.reduce(function(t,i){return t+rowPrice(i);},0); };
  totalEl.innerHTML = '<div class="total"><div class="big">合計目安 約'+yen(sum(items.filter(function(i){return !i.isSeasoning;})))+
    '円</div><small>調味料は含みません</small></div>';
  var html = "";
  CATS.forEach(function(cat){
    var g = items.filter(function(i){return !i.isSeasoning && i.category===cat;});
    if(g.length) html += "<h3>"+esc(cat)+"</h3><ul>"+g.map(itemHtml).join("")+"</ul>";
  });
  var se = items.filter(function(i){return i.isSeasoning;});
  if(se.length) html += "<h3>"+SEASON_LABEL+"</h3><ul>"+se.map(itemHtml).join("")+
    '</ul><div class="sub">調味料を全部買うと約'+yen(sum(se))+'円</div>';
  el.innerHTML = html;
}
function renderRecipes(){
  var el = document.getElementById("recipes");
  var sel = RECIPES.filter(function(r){return state.menus.indexOf(r.id)>-1;});
  if(!sel.length){ el.innerHTML = '<div class="empty">メニューを選ぶと作り方が表示されます</div>'; return; }
  el.innerHTML = sel.map(function(r){
    return '<div class="rc"><h3>'+esc(r.name)+'</h3><h4>材料</h4><ul>'+
      guardIngredients(r.ingredients).map(function(i){return '<li>'+esc(i.name)+' '+esc(fmt(i.amount)+i.unit)+'</li>';}).join("")+
      '</ul><h4>手順</h4><ol>'+r.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ol></div>';
  }).join("");
}
function render(){ renderPickers(); renderList(); if(view === "recipe") renderRecipes(); }

/* ---------- イベント ---------- */
document.addEventListener("change",function(e){
  var t = e.target;
  if(t.dataset.kind){
    var arr = state[t.dataset.kind], id = t.dataset.id, i = arr.indexOf(id);
    if(t.checked && i<0) arr.push(id); else if(!t.checked && i>-1) arr.splice(i,1);
    save(); render();
  }else if(t.dataset.key){
    if(t.checked) state.checked[t.dataset.key]=true; else delete state.checked[t.dataset.key];
    save(); renderList();
  }
});
document.getElementById("reset").addEventListener("click",function(){
  if(!confirm("選択とチェックをすべてリセットしますか？")) return;
  state = {menus:[],staples:[],checked:{}};
  try{ localStorage.removeItem(KEY); }catch(e){}
  render();
});

document.getElementById("confirm").addEventListener("click",function(){ setView("list"); });
document.getElementById("back").addEventListener("click",function(){ setView("pick"); });
document.getElementById("toRecipe").addEventListener("click",function(){ setView("recipe"); });
document.getElementById("backList").addEventListener("click",function(){ setView("list"); });

applyView();
render();
})();
</script>
</body>
